// Declares that the SASL_PLAINTEXT listener speaks SCRAM. No credentials live
// here: SCRAM stores salted/hashed passwords in Kafka's own metadata, created
// via `kafka-configs --alter --add-config 'SCRAM-SHA-256=[...]'` (see
// scripts/generate-production-credentials.sh), not in this file. Safe to commit.
KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required;
};
